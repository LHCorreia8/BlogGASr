<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="100%" style="background-color: #ffffff; font-family: &#39;Segoe UI&#39;, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50" />
    </marker>
    <marker id="arrow-pwr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b" />
    </marker>
    <marker id="arrow-comm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#27ae60" />
    </marker>
  </defs>

  <!-- Título -->
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a252f">DIAGRAMA DE BLOCOS FUNCIONAL E PINAGEM ELÉTRICA</text>

  <!-- BARRAMENTO GND COMUM -->
  <rect x="40" y="50" width="920" height="28" rx="4" fill="#2c3e50" />
  <text x="500" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">BARRAMENTO GND COMUM (TERRA) — Todos os negativos das 3 baterias, reguladores, placas e módulos interligados</text>

  <!-- ================= BLOCO DE ALIMENTAÇÃO (TOPO) ================= -->
  <!-- Bateria 1 + L7805 -->
  <rect x="40" y="100" width="120" height="50" rx="4" fill="#f8f9f9" stroke="#2c3e50" stroke-width="2" />
  <text x="100" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a252f">BATERIA 1</text>
  <text x="100" y="138" text-anchor="middle" font-size="11" fill="#5d6d7e">2x 18650 (7.4V)</text>

  <line x1="160" y1="125" x2="200" y2="125" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-pwr)" />

  <rect x="200" y="100" width="130" height="50" rx="4" fill="#fdedec" stroke="#c0392b" stroke-width="2" />
  <text x="265" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#922b21">L7805CV (Reg. 1)</text>
  <text x="265" y="138" text-anchor="middle" font-size="11" fill="#922b21">Saída: 5V</text>

  <!-- Bateria 2 + L7805 -->
  <rect x="640" y="100" width="120" height="50" rx="4" fill="#f8f9f9" stroke="#2c3e50" stroke-width="2" />
  <text x="700" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a252f">BATERIA 2</text>
  <text x="700" y="138" text-anchor="middle" font-size="11" fill="#5d6d7e">2x 18650 (7.4V)</text>

  <line x1="760" y1="125" x2="800" y2="125" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-pwr)" />

  <rect x="800" y="100" width="130" height="50" rx="4" fill="#fdedec" stroke="#c0392b" stroke-width="2" />
  <text x="865" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#922b21">L7805CV (Reg. 2)</text>
  <text x="865" y="138" text-anchor="middle" font-size="11" fill="#922b21">Saída: 5V</text>

  <!-- Linhas de 5V -->
  <path d="M 265 150 L 265 180 L 365 180 L 365 220" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-pwr)" />
  <text x="315" y="173" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">5V (ESP Vermelha + MQ + LEDs)</text>

  <path d="M 865 150 L 865 180 L 635 180 L 635 220" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-pwr)" />
  <text x="755" y="173" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">5V (ESP Preta + Sensores Pista)</text>

  <!-- ================= BLOCO CENTRAL: AS DUAS ESP32 ================= -->
  
  <!-- ESP32-S3 VERMELHA -->
  <rect x="270" y="220" width="190" height="340" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="3" />
  <rect x="270" y="220" width="190" height="45" rx="6" fill="#c0392b" />
  <text x="365" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">ESP32-S3 (VERMELHA)</text>
  <text x="365" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#f9ebea">COM WI-FI ATIVO</text>

  <!-- Pinos Internos ESP Vermelha -->
  <text x="280" y="290" font-size="12" font-weight="bold" fill="#922b21">Pino 5V / GND</text>
  <text x="280" y="335" font-size="12" font-weight="bold" fill="#1a252f">Pino 4 (ADC1)</text>
  <text x="280" y="365" font-size="12" font-weight="bold" fill="#1a252f">Pino 5 (ADC1)</text>
  <text x="280" y="395" font-size="12" font-weight="bold" fill="#1a252f">Pino 6 (ADC1)</text>
  <text x="280" y="425" font-size="12" font-weight="bold" fill="#1a252f">Pino 7 (ADC1)</text>
  <text x="280" y="505" font-size="12" font-weight="bold" fill="#1a252f">Pino 8 (Saída)</text>

  <!-- Pinos de Comunicação ESP Vermelha (Lado Direito) -->
  <text x="450" y="345" text-anchor="end" font-size="12" font-weight="bold" fill="#1e8449">Pino 15 (Saída)</text>
  <text x="450" y="405" text-anchor="end" font-size="12" font-weight="bold" fill="#1e8449">Pino 16 (Entrada)</text>
  <text x="450" y="465" text-anchor="end" font-size="12" font-weight="bold" fill="#1e8449">Pino 17 (Entrada)</text>


  <!-- ESP32 PRETA -->
  <rect x="540" y="220" width="190" height="340" rx="6" fill="#ebedef" stroke="#2c3e50" stroke-width="3" />
  <rect x="540" y="220" width="190" height="45" rx="6" fill="#2c3e50" />
  <text x="635" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">ESP32 (PRETA)</text>
  <text x="635" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#d5d8dc">SEM WI-FI (NAVEGAÇÃO)</text>

  <!-- Pinos de Comunicação ESP Preta (Lado Esquerdo) -->
  <text x="550" y="345" font-size="12" font-weight="bold" fill="#1e8449">Pino 19 (Entrada)</text>
  <text x="550" y="405" font-size="12" font-weight="bold" fill="#1e8449">Pino 21 (Saída)</text>
  <text x="550" y="465" font-size="12" font-weight="bold" fill="#1e8449">Pino 22 (Saída)</text>

  <!-- Pinos Periféricos ESP Preta (Lado Direito) -->
  <text x="720" y="290" text-anchor="end" font-size="12" font-weight="bold" fill="#922b21">Pino 5V (Vin) / GND</text>
  <text x="720" y="335" text-anchor="end" font-size="12" font-weight="bold" fill="#1a252f">Pinos 34, 35, 36, 39</text>
  <text x="720" y="360" text-anchor="end" font-size="12" font-weight="bold" fill="#1a252f">Pinos 32, 33, 25, 26</text>
  <text x="720" y="425" text-anchor="end" font-size="12" font-weight="bold" fill="#1a252f">Pino 27 (Entrada)</text>
  <text x="720" y="495" text-anchor="end" font-size="12" font-weight="bold" fill="#1a252f">Pinos 12, 13 (Motor E)</text>
  <text x="720" y="525" text-anchor="end" font-size="12" font-weight="bold" fill="#1a252f">Pinos 14, 15 (Motor D)</text>


  <!-- ================= SETAS DE COMUNICAÇÃO ENTRE PLACAS ================= -->
  <line x1="460" y1="340" x2="540" y2="340" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow-comm)" />
  <text x="500" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">Manda Parar</text>

  <line x1="540" y1="400" x2="460" y2="400" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow-comm)" />
  <text x="500" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">Confirma Parado</text>

  <line x1="540" y1="460" x2="460" y2="460" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow-comm)" />
  <text x="500" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">Sinal de Setor</text>


  <!-- ================= PERIFÉRICOS ESQUERDA (PLACA VERMELHA) ================= -->
  <!-- Bloco Sensores MQ -->
  <rect x="40" y="305" width="160" height="140" rx="4" fill="#ebf5fb" stroke="#2980b9" stroke-width="2" />
  <text x="120" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4f72">SENSORES DE GÁS</text>
  <text x="120" y="348" text-anchor="middle" font-size="12" fill="#1a252f">• Módulo MQ-2</text>
  <text x="120" y="373" text-anchor="middle" font-size="12" fill="#1a252f">• Módulo MQ-4</text>
  <text x="120" y="398" text-anchor="middle" font-size="12" fill="#1a252f">• Módulo MQ-135</text>
  <text x="120" y="423" text-anchor="middle" font-size="12" fill="#1a252f">• Módulo MQ-136</text>

  <line x1="200" y1="330" x2="270" y2="330" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="360" x2="270" y2="360" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="390" x2="270" y2="390" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="420" x2="270" y2="420" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Bloco LEDs RGB -->
  <rect x="40" y="475" width="160" height="55" rx="4" fill="#ebf5fb" stroke="#2980b9" stroke-width="2" />
  <text x="120" y="498" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4f72">PAINEL 8 LEDs RGB</text>
  <text x="120" y="516" text-anchor="middle" font-size="11" fill="#5d6d7e">WS2812 (Endereçável)</text>

  <line x1="270" y1="502" x2="200" y2="502" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />


  <!-- ================= PERIFÉRICOS DIREITA (PLACA PRETA) ================= -->
  <!-- Bloco Seguidor de Linha -->
  <rect x="800" y="305" width="160" height="75" rx="4" fill="#ebf5fb" stroke="#2980b9" stroke-width="2" />
  <text x="880" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4f72">SEGUIDOR DE LINHA</text>
  <text x="880" y="350" text-anchor="middle" font-size="12" fill="#1a252f">Módulo de 8 Canais</text>
  <text x="880" y="366" text-anchor="middle" font-size="11" fill="#5d6d7e">(Saídas Digitais S1-S8)</text>

  <line x1="800" y1="330" x2="730" y2="330" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="800" y1="355" x2="730" y2="355" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Bloco Sensor de Setor -->
  <rect x="800" y="395" width="160" height="50" rx="4" fill="#ebf5fb" stroke="#2980b9" stroke-width="2" />
  <text x="880" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4f72">SENSOR DE SETOR</text>
  <text x="880" y="434" text-anchor="middle" font-size="11" fill="#5d6d7e">Leitura de Marcação</text>

  <line x1="800" y1="420" x2="730" y2="420" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Bloco Ponte H e Motores -->
  <rect x="800" y="465" width="160" height="95" rx="4" fill="#fef9e7" stroke="#f39c12" stroke-width="2" />
  <text x="880" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#b7950b">PONTE H (L298N)</text>
  <text x="880" y="508" text-anchor="middle" font-size="12" fill="#1a252f">IN1 / IN2 ➔ Motor Esq.</text>
  <text x="880" y="528" text-anchor="middle" font-size="12" fill="#1a252f">IN3 / IN4 ➔ Motor Dir.</text>
  <text x="880" y="548" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Alimentação: Bateria 3</text>

  <line x1="730" y1="490" x2="800" y2="490" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="730" y1="520" x2="800" y2="520" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Bateria 3 (Exclusiva Motores) -->
  <rect x="800" y="600" width="160" height="50" rx="4" fill="#f8f9f9" stroke="#2c3e50" stroke-width="2" />
  <text x="880" y="622" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a252f">BATERIA 3 (MOTORES)</text>
  <text x="880" y="638" text-anchor="middle" font-size="11" fill="#5d6d7e">2x 18650 (7.4V a 8.4V)</text>

  <line x1="880" y1="600" x2="880" y2="560" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-pwr)" />

  <!-- Legenda Inferior -->
  <rect x="40" y="600" width="690" height="50" rx="4" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="1.5" />
  <text x="60" y="630" font-size="12" font-weight="bold" fill="#1a252f">LEGENDA:</text>
  <line x1="135" y1="626" x2="175" y2="626" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-pwr)" />
  <text x="185" y="630" font-size="12" fill="#1a252f">Alimentação (VCC)</text>
  
  <line x1="320" y1="626" x2="360" y2="626" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)" />
  <text x="370" y="630" font-size="12" fill="#1a252f">Sinais de Sensores / Atuadores</text>

  <line x1="570" y1="626" x2="610" y2="626" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow-comm)" />
  <text x="620" y="630" font-size="12" fill="#1a252f">Comunicação entre ESPs</text>
</svg>
